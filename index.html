<style>
/* Layout: one-column exercise-book page. Graph-paper ground, white "sheets" for activities,
   red-pen stamp for completed topics. Blue ink = actions, red pen = corrections. */
:root{
  --paper:#F2F5FB; --grid:#DCE4F3; --ink:#17285C; --soft:#53618B; --card:#FFFFFF; --line:#C4D0E8;
  --pen:#2447C8; --on-pen:#FFFFFF; --pen-bg:#E4EAFC;
  --red:#C73535; --red-bg:#FCE9E7; --green:#16764F; --green-bg:#DDF3EA;
  --mark:#FFE88A; --mark-ink:#3B2F00;
  --display:'Anuphan','Noto Sans Thai',system-ui,sans-serif; --body:'Anuphan','Noto Sans Thai',system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#0F1633; --grid:#1A2450; --ink:#E8EDFB; --soft:#A5B2D9; --card:#172046; --line:#2B3A72;
  --pen:#8FA9FF; --on-pen:#0C1331; --pen-bg:#22306A;
  --red:#FF8F86; --red-bg:#3F2030; --green:#62D6A4; --green-bg:#16382F;
  --mark:#5B4C12; --mark-ink:#FFF1BD; color-scheme:dark;}}
:root[data-theme="dark"]{
  --paper:#0F1633; --grid:#1A2450; --ink:#E8EDFB; --soft:#A5B2D9; --card:#172046; --line:#2B3A72;
  --pen:#8FA9FF; --on-pen:#0C1331; --pen-bg:#22306A;
  --red:#FF8F86; --red-bg:#3F2030; --green:#62D6A4; --green-bg:#16382F;
  --mark:#5B4C12; --mark-ink:#FFF1BD; color-scheme:dark;}
*{box-sizing:border-box}
body{background-color:var(--paper);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:24px 24px;color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.55}
.wrap{max-width:720px;margin:0 auto;padding-inline:16px;padding-block:20px 56px}
h1,h2,h3{font-family:var(--display);line-height:1.25;margin:0;text-wrap:balance}
h1{font-size:2.2rem}
h2{font-size:1.35rem}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--pen);outline-offset:2px}
.top{display:flex;flex-direction:column;gap:2px;margin-bottom:18px}
.kicker{font-size:.9rem;color:var(--soft);font-weight:600}
.top.hero{position:relative;overflow:hidden;isolation:isolate;padding:18px 16px 16px;border-radius:16px;box-shadow:0 2px 0 rgba(0,0,0,.18);gap:6px;color:#fff;
  background:linear-gradient(118deg,#15171d 0%,#2b2e37 34%,#4a4d58 52%,#9a1027 78%,#d3122f 100%)}

.hero .hdeco{position:absolute;inset:0;width:100%;height:100%;z-index:-1;pointer-events:none}
.hero .hdeco svg{width:100%;height:100%;display:block}
.hero .hrow{display:flex;align-items:center;gap:12px}
.hero .logo{position:absolute;top:10px;right:10px;z-index:1;margin:0;background:none;padding:0;pointer-events:none}
.hero .logo img{display:block;width:128px;height:auto;filter:drop-shadow(0 0 1px #fff) drop-shadow(0 0 1px #fff) drop-shadow(0 0 2px #fff) drop-shadow(0 4px 7px rgba(8,16,70,.5))}
.hero h1{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@media(min-width:700px){.hero p.def{max-width:min(34em,calc(100% - 210px))}.hero .logo{top:14px;right:18px}.hero .logo img{width:170px}}
.hero .hi{align-self:flex-start;display:inline-flex;gap:6px;align-items:center;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.3);border-radius:999px;padding:2px 12px;font-size:.88rem;font-weight:700;color:#fff}
.hero h1{color:#fff;font-size:2rem;line-height:1.12;text-shadow:0 2px 0 rgba(8,16,70,.35);margin-top:4px}
.hero h1 em{font-style:normal;color:#FFE88A}
.hero .def{color:#F4F6FB;font-size:.98rem;line-height:1.45;font-weight:600;max-width:34em}
.hero .slg{color:#FFE88A;font-size:.9rem;font-weight:700;line-height:1.35;max-width:calc(100% - 150px);min-height:84px;text-wrap:balance}
.hero .slg span{display:block;color:#E9ECF4;font-weight:600}
.hero .facts{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.hero .facts b{background:#fff;color:#142A6B;border-radius:999px;padding:1px 11px;font-size:.84rem;font-weight:800;box-shadow:0 2px 0 rgba(8,16,70,.3)}

.series{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.series h2{grid-column:1/-1;font-size:1rem;margin:0}
.series h2.sbanner{position:relative;display:flex;align-items:center;justify-content:space-between;gap:10px;overflow:hidden;border-radius:16px;padding:16px 14px 16px 18px;color:#fff;background:linear-gradient(104deg,#23262e 0%,#3b404c 64%,#c8102e 64.4%,#8e0a1f 100%);box-shadow:0 3px 0 rgba(0,0,0,.35);isolation:isolate}
.sbanner::before{content:"";position:absolute;z-index:-1;right:-20px;top:-30px;bottom:-30px;width:46%;background:repeating-linear-gradient(104deg,rgba(255,255,255,.14) 0 3px,transparent 3px 14px)}
.sbanner::after{content:"";position:absolute;z-index:-1;left:-24px;bottom:-34px;width:120px;height:120px;border-radius:50%;border:14px solid rgba(255,255,255,.07)}
.sbt{display:flex;flex-direction:column;gap:1px;min-width:0}
.sben{font-size:1.7rem;font-weight:900;line-height:1.08;letter-spacing:-.01em;text-shadow:0 2px 0 rgba(0,0,0,.35)}
.sbth{font-size:1.3rem;font-weight:800;line-height:1.25;color:#ffd9de}
.sbh{font-size:.84rem;font-weight:600;line-height:1.35;color:#d7dae2;margin-top:4px}
.sbadge{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;gap:1px;padding:8px 11px;border-radius:12px;background:rgba(255,255,255,.16);border:2px solid rgba(255,255,255,.7);text-align:center;transform:rotate(-3deg)}
.sbadge b{font-size:.95rem;font-weight:900;line-height:1.1;text-transform:uppercase;letter-spacing:.04em}
.sbadge i{font-style:normal;font-size:.78rem;font-weight:700}
@media(min-width:620px){.sben{font-size:2.1rem}.sbth{font-size:1.5rem}.sbh{font-size:.95rem}}
.sc{--c:#2447C8;position:relative;display:flex;flex-direction:column;gap:2px;align-items:flex-start;text-align:left;background:var(--c);color:#fff;border:2px solid var(--c);border-radius:12px;padding:10px 12px;min-height:84px;box-shadow:0 2px 0 rgba(0,0,0,.2)}
.sc.on{grid-column:1/-1;flex-direction:row;align-items:center;gap:12px;min-height:72px}
.sc .si{flex:0 0 auto;width:38px;height:38px;border-radius:50%;background:rgba(255,255,255,.2);display:grid;place-items:center}
.sc .si svg{width:22px;height:22px;fill:none;stroke:#fff;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.sc b{font-size:1rem;line-height:1.2}
.sc .sd{font-size:.8rem;line-height:1.3;opacity:.95}
.sc .pill{font-size:.72rem;font-weight:700;background:rgba(255,255,255,.22);border-radius:999px;padding:0 8px;margin-top:2px}
.sc:not(.on){border-style:dashed;border-color:rgba(255,255,255,.6)}
.sc.live:not(.on){border-style:solid;border-color:var(--c)}
.tinline{display:flex;flex-direction:column;gap:10px}
.tinline .th1 h1{font-size:1.4rem}
.sc.on .pill{background:#fff;color:var(--c)}
.sc .sfacts{display:flex;flex-wrap:wrap;gap:5px;margin:2px 0}
.sc .sfacts i{font-style:normal;background:#fff;color:#142A6B;border-radius:999px;padding:0 9px;font-size:.78rem;font-weight:800}
.sc .stxt{display:flex;flex-direction:column;gap:2px;align-items:flex-start;min-width:0}
.herobar{padding:12px 16px;border-radius:14px;background:linear-gradient(135deg,#142A6B 0%,#2A52D6 100%);box-shadow:0 2px 0 rgba(0,0,0,.18);display:flex;flex-direction:column;gap:2px}
.herobar .kicker{color:#fff;font-size:1.3rem;font-weight:800;line-height:1.25;letter-spacing:.01em}
.herobar .sub{color:#C9D6FF;font-weight:600;font-size:.95rem;margin:0}
.sub{color:var(--soft)}
.card{background:var(--card);border:1.5px solid var(--line);border-radius:10px;padding:16px;min-width:0}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.th{display:block;font-size:.76em;font-weight:500;opacity:.9;line-height:1.25;letter-spacing:0}
label .th{opacity:.75}
.back .th{display:inline;margin-left:0;font-size:.8em;font-weight:700}
.btn{background:var(--pen);color:var(--on-pen);border:0;border-radius:8px;padding:10px 18px;font-weight:700;min-height:44px}
.btn.ghost{background:transparent;color:var(--pen);border:1.5px solid var(--pen)}
.btn.small{min-height:36px;padding:6px 12px;font-size:.92rem}
.btn.cta{background:transparent;color:var(--red);border:2px solid var(--red);font-weight:800}
.btn[disabled]{opacity:.45;cursor:default}
.field{display:flex;flex-direction:column;gap:4px}
.field label{font-weight:600}
input[type=text],input[type=password],textarea{font:inherit;color:var(--ink);background:var(--paper);border:1.5px solid var(--line);border-radius:8px;padding:10px 12px;width:100%}
textarea{min-height:130px;resize:vertical;line-height:1.7}
.hint{font-size:.88rem;color:var(--soft)}
.hint[hidden]{display:none}
.next{border-color:var(--pen);background:var(--pen-bg)}
.next .nx{font-family:var(--display);font-size:1.35rem;line-height:1.3}
.btn.go{min-height:48px;font-size:1.05rem;padding:10px 28px}
.rv{padding:10px 0;border-top:1.5px dashed var(--line)}
.rv-en{font-weight:700;overflow-wrap:anywhere}
.rv .btn{flex:none}
.rv-more{margin-top:8px}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.day{display:flex;flex-direction:column;align-items:center;gap:4px;min-width:0}
.day .dl{font-size:.85rem;color:var(--soft);font-weight:600}
.day .dot{width:34px;height:34px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font-weight:700;color:var(--on-pen);background:transparent}
.day.on .dot{background:var(--pen);border-color:var(--pen)}
.day.today .dot{border:2.5px solid var(--pen)}
.day.today .dl{color:var(--ink)}
.day.fut{opacity:.55}
.wk{font-size:.95rem}
.map{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media (min-width:520px){.map{grid-template-columns:repeat(5,1fr)}}
.cell{position:relative;display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;background:var(--card);border:1.5px solid var(--line);border-radius:10px;padding:14px 8px 10px;min-width:0}
.cell:hover{border-color:var(--pen)}
.cell.full{border-color:var(--green)}
.ring{width:64px;height:64px;border-radius:50%;display:grid;place-items:center}
.ringin{width:46px;height:46px;border-radius:50%;background:var(--card);display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:1.25rem}
.cell .cen{font-family:var(--display);font-weight:700;font-size:.92rem;line-height:1.25;overflow-wrap:anywhere}
.star{position:absolute;top:6px;right:6px;width:26px;height:26px;border-radius:50%;background:var(--mark);color:var(--mark-ink);display:grid;place-items:center;font-size:1rem;line-height:1}
.topic{position:relative;text-align:left;display:flex;flex-direction:column;gap:6px;width:100%;background:var(--card);border:1.5px solid var(--line);border-radius:10px;padding:14px 16px}
.topic:hover{border-color:var(--pen)}
.topic .no{font-size:.82rem;color:var(--soft);font-weight:600}
.topic .en{font-family:var(--display);font-weight:700;font-size:1.15rem;padding-right:70px}
.topic .th{color:var(--soft);font-size:.95rem}
.segs{display:flex;gap:4px;margin-top:4px}
.seg{flex:1;height:8px;border-radius:2px;background:var(--line)}
.seg.on{background:var(--pen)}
.segs.small .seg{height:6px}
.stamp{position:absolute;top:12px;right:12px;border:2px solid var(--red);color:var(--red);padding:0 8px;border-radius:6px;transform:rotate(-7deg);font-family:var(--display);font-weight:700;font-size:.95rem;background:var(--card)}
.ubanner{position:relative;overflow:hidden;display:flex;align-items:center;gap:14px;border-radius:12px;padding:18px 16px;color:#fff;background:var(--ub,#2447C8);box-shadow:0 2px 0 rgba(0,0,0,.18)}
.ubanner .ubt{display:flex;flex-direction:column;gap:2px;min-width:0;flex:1}
.ubanner .ubn{font-size:.85rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;opacity:.92}
.ubanner .ubh{font-family:var(--display);font-weight:700;font-size:1.65rem;line-height:1.15;overflow-wrap:anywhere}
.ubanner .ubp{font-size:.85rem;opacity:.95}
.medal{flex:none;width:var(--ms,64px);height:var(--ms,64px);border-radius:50%;background:var(--rim);border:3px solid #fff;box-shadow:0 1px 3px rgba(0,0,0,.35);display:grid;place-items:center}
.medal .mdisc{width:68%;height:68%;border-radius:50%;background:var(--mu);display:grid;place-items:center}
.medal .mdisc svg{width:62%;height:62%;fill:none;stroke:#fff;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.mwrap{flex:none;display:flex;flex-direction:column;align-items:center;gap:3px}
.mlbl{font-size:.72rem;font-weight:700;letter-spacing:.02em}
.mcard{display:flex;align-items:center;gap:14px}
.ubanner.hasm{gap:10px}.ubanner.hasm .ubi{width:48px;height:48px}.ubanner.hasm .ubi svg{width:30px;height:30px}.ubanner.hasm .ubh{font-size:1.4rem}
.medal .mdisc{box-shadow:inset 0 0 0 2px rgba(255,255,255,.85)}
.ubanner .ubi{flex:none;width:64px;height:64px;border-radius:50%;background:rgba(255,255,255,.18);display:grid;place-items:center}
.ubanner svg{width:40px;height:40px;fill:none;stroke:#fff;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.tabs{display:grid;grid-template-columns:repeat(auto-fit,minmax(44px,1fr));gap:6px}
.tab{border:1.5px solid var(--line);background:var(--card);border-radius:8px;padding:8px 2px;text-align:center;font-weight:600;font-size:.8rem;white-space:nowrap;min-height:44px}
.tab[aria-selected=true]{border-color:var(--pen);background:var(--pen-bg);color:var(--ink)}
.tab .ck{color:var(--green);font-weight:700}
.tab{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:.7rem;padding:6px 1px;--sc:var(--pen)}
.tab svg{width:22px;height:22px;fill:none;stroke:var(--sc);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.tab[aria-selected=true]{background:var(--sc);border-color:var(--sc);color:#fff}
.tab[aria-selected=true] svg{stroke:#fff}
.tab[aria-selected=true] .ck{color:#fff}
.shead{display:flex;align-items:center;gap:10px;border-radius:10px;padding:10px 14px;color:#fff;background:var(--sc);font-family:var(--display);font-weight:700;font-size:1.15rem}
.shead svg{width:28px;height:28px;fill:none;stroke:#fff;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.shead small{margin-left:auto;font-family:inherit;font-size:.8rem;font-weight:600;opacity:.95}
.stabs{grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.stabs .tab{font-size:.62rem;padding:6px 0;position:relative;letter-spacing:-.01em}
.stabs .tab .ck{position:absolute;top:1px;right:3px;font-size:.62rem;line-height:1}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]) .tab:not([aria-selected=true]) svg{filter:brightness(1.7)}}
:root[data-theme=dark] .tab:not([aria-selected=true]) svg{filter:brightness(1.7)}
.hd{display:flex;align-items:center;gap:10px}
.hdi{flex:none;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--hc,var(--pen))}
.hdi svg{width:20px;height:20px;fill:none;stroke:#fff;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.bi{display:inline-flex;vertical-align:middle;margin-right:6px}
.bi svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.rbig{display:flex;align-items:center;gap:12px}
.pbanner{margin-bottom:14px}
.pbanner h1{margin:0}
.utab{flex-direction:row;font-size:.85rem;border-bottom:5px solid var(--sc);padding:8px 2px 5px}
.utab[aria-selected=true]{background:var(--sc);border-color:var(--sc);color:#fff;box-shadow:0 2px 0 rgba(0,0,0,.2)}
.trow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0;border-top:1.5px dashed var(--line)}
.trow>div{display:flex;flex-direction:column;gap:2px;min-width:0}
.opt.sel{border-color:var(--pen);background:var(--pen-bg);font-weight:600}
.rvq{padding:10px 0;border-top:1.5px dashed var(--line);display:flex;flex-direction:column;gap:4px}
.rvq .mk{font-weight:700}
.rvq .mk.ok{color:var(--green)}
.rvq .mk.no{color:var(--red)}
.pvw{background:var(--pen-bg);border:1.5px dashed var(--pen);border-radius:8px;padding:8px 12px;font-size:.9rem}
.passage{background:var(--paper);border-left:5px solid var(--pen);border-radius:8px;padding:12px 14px}
.tcell{grid-column:1/-1;flex-direction:row;align-items:center;justify-content:flex-start;gap:12px;text-align:left;padding:12px 14px;border-left:6px solid var(--tc);background:var(--card)}
.tcell .tci{flex:none;width:52px;height:52px;border-radius:50%;background:var(--tc);display:grid;place-items:center}
.tcell .tci svg{width:28px;height:28px;fill:none;stroke:#fff;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.tcell .tct{display:flex;flex-direction:column;gap:2px;min-width:0;flex:1}
.tcell .tct b{font-family:var(--display);font-size:1.05rem;line-height:1.25}
.tcell .tcgo{flex:none;font-weight:800;color:var(--red);white-space:nowrap}
.tcell.ok{border-color:var(--green);border-left-color:var(--tc)}
.tcell .tcgo.ok{color:var(--red)}
.cell.lock{background:var(--paper);border-style:dashed}
.cell.lock .ring,.cell.lock .cen{opacity:.55}
.lockb{position:absolute;top:6px;right:6px;width:26px;height:26px;border-radius:50%;background:var(--line);display:grid;place-items:center}
.lockb svg{width:15px;height:15px;fill:none;stroke:var(--soft);stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.tcell .lockb{position:static;flex:none;width:34px;height:34px}
.tcell .lockb svg{width:18px;height:18px}
.tbanner{margin-top:4px;margin-bottom:12px}
.tbanner .ubh{font-size:1.5rem}
.tbanner .ubq{font-size:.95rem;opacity:.95}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.vc{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 12px}
.vc b{font-family:var(--display);font-size:1.05rem;display:block}
.vc span{color:var(--soft);font-size:.92rem}
.ico{width:40px;height:40px;flex:none;border-radius:50%;border:1.5px solid var(--pen);background:transparent;color:var(--pen);display:grid;place-items:center;padding:0}
.ico svg{width:20px;height:20px}
.btn svg{width:18px;height:18px;vertical-align:-3px;flex:none}
.qhead{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:8px}
.qhead .segs{flex:1;max-width:240px}
.qno{font-weight:600;color:var(--soft)}
.qtext{font-family:var(--display);font-weight:500;font-size:1.2rem;margin-block:6px 12px}
.lk{display:flex;gap:6px}
.lk button{flex:1;min-height:46px;border:1.5px solid var(--line);border-radius:8px;background:var(--paper);font-weight:600}
.lk button[aria-pressed="true"]{border-color:var(--pen);background:var(--pen-bg)}

/* ===== Theme: sky blue / violet / gold (matches the banner + footer) ===== */
:root{--pen:#2B46D6;--pen2:#6A3FD0;--pen-bg:#E7ECFF;--line:#C3CEF3;--soft:#4F5F92;--paper:#EEF3FF;
  --gold:#FFD83B;--gold2:#FFB300;--gold-ink:#3A2A00;--btn1:#2B46D6;--btn2:#6A3FD0;--edge:rgba(80,110,230,.35);--glow:rgba(43,70,214,.12)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--pen:#8FA9FF;--pen2:#B29BFF;--pen-bg:#1F2C6E;--line:#2E3D82;--soft:#B2BFE8;--paper:#0B1238;--card:#141D4A;
  --btn1:#7E98FF;--btn2:#A98BFF;--edge:rgba(130,160,255,.35);--glow:rgba(0,0,0,.3)}}
:root[data-theme="dark"]{--pen:#8FA9FF;--pen2:#B29BFF;--pen-bg:#1F2C6E;--line:#2E3D82;--soft:#B2BFE8;--paper:#0B1238;--card:#141D4A;
  --btn1:#7E98FF;--btn2:#A98BFF;--edge:rgba(130,160,255,.35);--glow:rgba(0,0,0,.3)}
body{background-color:var(--paper);background-image:radial-gradient(ellipse 90% 280px at 12% -60px,rgba(255,255,255,.95),transparent 70%),radial-gradient(ellipse 70% 240px at 100% 140px,rgba(185,165,255,.38),transparent 70%),linear-gradient(180deg,#CFE2FF 0,#E4EAFF 380px,#EFEBFF 100%);background-size:auto;background-repeat:no-repeat}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) body{background-image:radial-gradient(ellipse 90% 280px at 12% -60px,rgba(110,140,255,.28),transparent 70%),radial-gradient(ellipse 70% 240px at 100% 140px,rgba(150,110,255,.22),transparent 70%),linear-gradient(180deg,#0A1236 0,#121549 420px,#1A1060 100%)}}
:root[data-theme="dark"] body{background-image:radial-gradient(ellipse 90% 280px at 12% -60px,rgba(110,140,255,.28),transparent 70%),radial-gradient(ellipse 70% 240px at 100% 140px,rgba(150,110,255,.22),transparent 70%),linear-gradient(180deg,#0A1236 0,#121549 420px,#1A1060 100%)}
/* cards */
.card{position:relative;border-radius:16px;border:1.5px solid var(--edge);background:var(--card);box-shadow:0 2px 0 var(--glow),0 12px 26px var(--glow)}
.card::before{content:"";position:absolute;left:14px;right:14px;top:0;height:4px;border-radius:0 0 6px 6px;background:linear-gradient(90deg,#1B3FC4,#6A3FD0 60%,var(--gold))}
.hdi{background:linear-gradient(160deg,#3aa0ff,#1c63e0);box-shadow:0 2px 6px rgba(20,50,160,.35),inset 0 1px 0 rgba(255,255,255,.4)}
input[type=text],input[type=password],textarea,select{border-radius:10px}
input:focus,select:focus,textarea:focus{border-color:var(--pen);box-shadow:0 0 0 3px var(--glow);outline:none}
/* buttons */
.btn{background:linear-gradient(135deg,var(--btn1),var(--btn2));border-radius:12px;box-shadow:0 3px 0 rgba(20,30,120,.35),inset 0 1px 0 rgba(255,255,255,.25)}
.btn:active:not([disabled]){transform:translateY(2px);box-shadow:0 1px 0 rgba(20,30,120,.35)}
.btn.ghost{background:rgba(255,255,255,.55);color:var(--pen);border:1.5px solid var(--pen);box-shadow:none}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .btn.ghost{background:rgba(255,255,255,.06)}}
:root[data-theme="dark"] .btn.ghost{background:rgba(255,255,255,.06)}
.btn.cta{background:linear-gradient(180deg,var(--gold),var(--gold2));color:var(--gold-ink);border:0;box-shadow:0 3px 0 rgba(150,100,0,.4),inset 0 1px 0 rgba(255,255,255,.5)}
/* guestbook */
.gbar{background:linear-gradient(118deg,#1B3FC4 0%,#0F2A9D 52%,#3A22A0 100%);box-shadow:0 3px 0 rgba(8,16,70,.3),0 10px 22px var(--glow);position:relative;overflow:hidden;isolation:isolate}
.gbar::after{content:"";position:absolute;z-index:-1;right:-70px;bottom:-84px;width:190px;height:110px;border-radius:50%;border:2px solid rgba(255,216,59,.65)}
.gbar::before{content:"";position:absolute;z-index:-1;inset:0;background:radial-gradient(ellipse 60% 140% at 100% 0,rgba(255,255,255,.22),transparent 60%)}

/* learning-series banner */
.series h2.sbanner{background:linear-gradient(118deg,#1B3FC4 0%,#0F2A9D 52%,#3A22A0 100%);box-shadow:0 3px 0 rgba(8,16,70,.3),0 10px 22px var(--glow)}
.sbanner::before{width:auto;left:0;right:0;top:0;bottom:0;background:radial-gradient(ellipse 60% 140% at 100% 0,rgba(255,255,255,.24),transparent 60%),repeating-radial-gradient(circle at 100% 100%,rgba(255,255,255,.07) 0 2px,transparent 2px 18px)}

.sbadge{background:linear-gradient(180deg,#FFE066,#FFB300);color:var(--gold-ink);border-color:#fff;box-shadow:0 3px 0 rgba(120,80,0,.35)}
/* series cards */
.sc{border-radius:16px;background-image:linear-gradient(160deg,rgba(255,255,255,.26),rgba(255,255,255,0) 50%),linear-gradient(0deg,rgba(0,0,30,.16),transparent 45%);box-shadow:0 3px 0 rgba(0,0,0,.22),0 8px 16px var(--glow)}
.sc:not(.on){border-style:solid;border-color:rgba(255,255,255,.4)}
.sc.live:not(.on){border-color:rgba(255,255,255,.4)}
.sc:not(.live):not(.on){filter:saturate(.82)}
.sc.on{background-image:linear-gradient(120deg,#1B3FC4,#3A22A0),linear-gradient(160deg,rgba(255,255,255,.2),rgba(255,255,255,0) 50%);border-color:var(--gold);box-shadow:0 0 0 2px var(--gold),0 3px 0 rgba(0,0,0,.25),0 10px 20px var(--glow)}
.sc.on .pill{background:var(--gold);color:var(--gold-ink)}
.sc .sfacts i{background:rgba(255,255,255,.95)}
/* unit banner + tabs + tests + topics */
.ubanner{isolation:isolate;border-radius:18px;background:var(--ub,#2B46D6);box-shadow:0 3px 0 rgba(8,16,70,.3),0 10px 22px var(--glow)}
.ubanner{background:linear-gradient(120deg,var(--ub,#2B46D6) 0%,color-mix(in srgb,var(--ub,#2B46D6) 42%,#3A22A0) 100%)}
.ubanner::before{content:"";position:absolute;z-index:-1;inset:0;background:radial-gradient(ellipse 60% 140% at 100% 0,rgba(255,255,255,.24),transparent 60%),repeating-radial-gradient(circle at 100% 100%,rgba(255,255,255,.07) 0 2px,transparent 2px 18px)}
.ubanner::after{content:"";position:absolute;z-index:-1;right:-70px;bottom:-84px;width:200px;height:110px;border-radius:50%;border:2px solid rgba(255,216,59,.6)}

function utter(text,rate,pitch){
  const u=new SpeechSynthesisUtterance(spoken(text));u.lang='en-US';u.rate=rate||0.9;u.pitch=pitch||1;

/* ชื่อไทยที่เสียงอ่านภาษาอังกฤษอ่านเพี้ยน: ใช้การสะกดแทนเฉพาะตอนออกเสียง ไม่เปลี่ยนข้อความที่แสดง */
const PRON=[[/\bFah\b/g,'Fa']];
const spoken=t=>PRON.reduce((x,[r,w])=>x.replace(r,w),String(t));
/* ---- Neural voice clips (optional). If the files are missing, the device voice below is used. ---- */
const VC={idx:null,el:null,blobs:{},loading:{},order:[],tok:0,timer:0,unlocked:false,err:''};
const VC_SIL='data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEAQB8AAIA+AAACABAAZGF0YQAAAAA=';
function vcKey(text,slow){const s=(slow?'s|':'n|')+String(text).replace(/\s+/g,' ').trim();let h1=0xdeadbeef,h2=0x41c6ce57;
  for(let i=0;i<s.length;i++){const c=s.charCodeAt(i);h1=Math.imul(h1^c,2654435761);h2=Math.imul(h2^c,1597334677)}

  return(4294967296*(2097151&h2)+(h1>>>0)).toString(16)}

/* One shared <audio> element (works with the iPhone silent switch). It is "unlocked" by the first tap. */

  if(!VC.unlocked){VC.unlocked=true;VC.el.src=VC_SIL;const p=VC.el.play();if(p&&p.catch)p.catch(()=>{})}
  return VC.el}catch(e){VC.err='audio element: '+e;return null}}
function vcBlob(b){if(VC.blobs[b])return Promise.resolve(VC.blobs[b]);

    .catch(e=>{delete VC.loading[b];VC.err='bundle: '+e;throw e}))}
function vcWarm(name){try{if(!VC.idx)return;const b=VC.idx.bundles.indexOf(name);if(b>=0)vcBlob(b).catch(()=>{})}catch(e){}}
/* some words have a topic-specific recording: key 'word@tid' wins while that topic is open (temple in topic 25) */
const VCALT={25:{temple:1}};
function vcFind(text,slow){if(!VC.idx)return null;const a=!slow&&typeof view!=='undefined'&&view&&view.n==='topic'&&VCALT[view.tid];if(a&&a[text]){const c=VC.idx.clips[vcKey(text+'@'+view.tid,false)];if(c)return c}return VC.idx.clips[vcKey(text,slow)]||null}
function vcStop(){VC.tok++;clearInterval(VC.timer);try{if(VC.el)VC.el.pause()}catch(e){}}
function vcPlay(list,fail){const el=vcEl();if(!el){fail();return}
  const my=++VC.tok;clearInterval(VC.timer);try{el.pause()}catch(e){}
  let n=0;
  const bad=m=>{if(my===VC.tok){VC.err=m;fail()}};
  const next=()=>{if(my!==VC.tok||n>=list.length)return;const c=list[n++];
    vcBlob(c[0]).then(url=>{if(my!==VC.tok)return;
      const start=c[1]/1000,end=(c[1]+c[2])/1000;
      const run=()=>{if(my!==VC.tok)return;
        const go=()=>{if(my!==VC.tok)return;const pr=el.play();if(pr&&pr.catch)pr.catch(e=>bad('play: '+(e&&e.name)));
          clearInterval(VC.timer);VC.timer=setInterval(()=>{if(my!==VC.tok){clearInterval(VC.timer);return}
            if(el.currentTime>=end-0.03||el.ended){clearInterval(VC.timer);try{el.pause()}catch(e){}setTimeout(next,330)}},25)};
        if(Math.abs(el.currentTime-start)<0.02)go();
        else{const sk=()=>{el.removeEventListener('seeked',sk);go()};el.addEventListener('seeked',sk);el.currentTime=start}};

  if(!('speechSynthesis' in window)){toast('This device has no English voice.');return}

function say(text,rate,pitch){
  try{speechSynthesis.cancel()}catch(e){}
  const c=vcFind(text,(rate||0.9)<=0.65);

  vcStop();sayDevice(text,rate,pitch)

function sayMany(items,rate){
  try{speechSynthesis.cancel()}catch(e){}
  const cl=items.map(it=>vcFind(it.text,false));
  if(cl.length&&cl.every(Boolean)){vcPlay(cl,()=>sayManyDevice(items,rate));return}
  vcStop();sayManyDevice(items,rate)

function sayManyDevice(items,rate){
  if(!('speechSynthesis' in window)){toast('This device has no English voice.');return}
  try{speechSynthesis.cancel();items.forEach(it=>speechSynthesis.speak(utter(it.text,rate,it.pitch)))}catch(e){toast('Cannot play sound on this device.')}
}

/* the real-life mission box (win screen and Passport): I did it + how confident. Saved only on this phone (SAVE.real). */
function realBox(sc){
 const R=()=>(SAVE.real&&SAVE.real[sc.id])||{},set=o=>{SAVE.real=SAVE.real||{};SAVE.real[sc.id]=Object.assign({},R(),o);persist();paint()};
 const box=el('div',{class:'treal',style:'--c:'+sc.color});
 const paint=()=>{const r=R();box.replaceChildren(
  el('p',{class:'trk'},'Real-life mission · ภารกิจในชีวิตจริง'),
  el('p',{class:'tren'},sc.real[0]),el('p',{class:'trth'},sc.real[1]),
  el('p',{class:'trq'},'How confident are you to say it? · มั่นใจแค่ไหนที่จะพูด'),
  el('div',{class:'trconf',role:'group','aria-label':'How confident'},[['\u{1F61F}','ยังไม่มั่นใจ'],['\u{1F642}','พอได้'],['\u{1F604}','มั่นใจ']].map(([e,t],i)=>
   el('button',{type:'button',class:'trc'+(r.conf===i+1?' on':''),'aria-pressed':r.conf===i+1?'true':'false',onclick:()=>set({conf:i+1})},el('span',{},e),el('small',{},t)))),
  r.done?el('div',{class:'trdone'},el('b',{},'✓ Done · ทำแล้ว ('+r.done+')'),el('button',{type:'button',class:'trundo',onclick:()=>set({done:null})},'Undo · ยกเลิก'))
   :el('button',{type:'button',class:'btn trdo',onclick:()=>set({done:new Date().toLocaleDateString('th-TH',{day:'numeric',month:'short'})})},'I did it! ✓⁣ทำแล้ว'))};
 paint();return box}

const DEC_VS='attribute vec3 aPos;attribute vec2 aUV;uniform mat4 uVP;varying vec2 vUV;varying float vFog;void main(){vUV=aUV;gl_Position=uVP*vec4(aPos,1.0);vFog=clamp((gl_Position.w-20.0)/24.0,0.0,0.85);}';
const DEC_FS='precision mediump float;uniform sampler2D uT;varying vec2 vUV;varying float vFog;void main(){vec4 c=texture2D(uT,vUV);if(c.a<0.06)discard;gl_FragColor=vec4(mix(c.rgb*0.97,vec3(0.74,0.87,0.96),vFog),c.a);}';
function mkDecals(gl,list){
 const sh=(t,src)=>{const s=gl.createShader(t);gl.shaderSource(s,src);gl.compileShader(s);return s};
 const pr=gl.createProgram();gl.attachShader(pr,sh(gl.VERTEX_SHADER,DEC_VS));gl.attachShader(pr,sh(gl.FRAGMENT_SHADER,DEC_FS));gl.linkProgram(pr);
 if(!gl.getProgramParameter(pr,gl.LINK_STATUS)){console.warn('town decals off');return null}
 const AP=gl.getAttribLocation(pr,'aPos'),AU=gl.getAttribLocation(pr,'aUV'),VPl=gl.getUniformLocation(pr,'uVP'),Tl=gl.getUniformLocation(pr,'uT');
 const up=(tex,img)=>{try{gl.bindTexture(gl.TEXTURE_2D,tex);gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL,true);gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,gl.RGBA,gl.UNSIGNED_BYTE,img);gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL,false)}catch(e){}};
 const items=list.map(d=>{const c=Math.cos(d.ry||0),s=Math.sin(d.ry||0),hw=d.w/2,hh=d.h/2,rx=c*hw,rz=-s*hw;
  const v=(a,b,u,t)=>[d.x+a*rx,d.y+b*hh,d.z+a*rz,u,t];
  const q=[v(-1,-1,0,0),v(1,-1,1,0),v(1,1,1,1),v(-1,-1,0,0),v(1,1,1,1),v(-1,1,0,1)].flat();
  const b=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,b);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array(q),gl.STATIC_DRAW);
  const tex=gl.createTexture();gl.bindTexture(gl.TEXTURE_2D,tex);
  [[gl.TEXTURE_MIN_FILTER,gl.LINEAR],[gl.TEXTURE_MAG_FILTER,gl.LINEAR],[gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE],[gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE]].forEach(([k,val])=>gl.texParameteri(gl.TEXTURE_2D,k,val));
  gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,1,1,0,gl.RGBA,gl.UNSIGNED_BYTE,new Uint8Array([0,0,0,0]));
  const it={b,tex,ready:false};
  if(d.src){const im=new Image();im.onload=()=>{up(tex,im);it.ready=true};im.src=d.src+(d.src.includes('?')?'':'?v='+BUILD)}
  else if(d.draw){const cv=document.createElement('canvas');cv.width=d.cw||512;cv.height=d.ch||256;
   const paint=()=>{const g=cv.getContext('2d');g.clearRect(0,0,cv.width,cv.height);d.draw(g,cv.width,cv.height);up(tex,cv);it.ready=true};
   paint();try{if(document.fonts&&document.fonts.load)Promise.all([document.fonts.load('700 48px Anuphan'),document.fonts.load('600 48px Anuphan')]).then(paint).catch(()=>{})}catch(e){}}
  return it});
 return {n:items.length,ready:()=>items.filter(i=>i.ready).length,draw(VP){
  gl.useProgram(pr);gl.uniformMatrix4fv(VPl,false,VP);gl.uniform1i(Tl,0);gl.activeTexture(gl.TEXTURE0);
  gl.enable(gl.BLEND);gl.enable(gl.POLYGON_OFFSET_FILL);gl.polygonOffset(-1,-2);
  for(const it of items){if(!it.ready)continue;gl.bindBuffer(gl.ARRAY_BUFFER,it.b);gl.enableVertexAttribArray(AP);gl.vertexAttribPointer(AP,3,gl.FLOAT,false,20,0);
   gl.enableVertexAttribArray(AU);gl.vertexAttribPointer(AU,2,gl.FLOAT,false,20,12);gl.bindTexture(gl.TEXTURE_2D,it.tex);gl.drawArrays(gl.TRIANGLES,0,6)}
  gl.disableVertexAttribArray(AU);gl.disable(gl.POLYGON_OFFSET_FILL);gl.disable(gl.BLEND)}}}
